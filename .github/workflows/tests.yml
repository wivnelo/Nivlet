name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Lua
        run: brew install lua

      - name: Fetch pinned runtime and Sparkle
        run: |
          sh scripts/fetch-runtime.sh
          sh scripts/check-runtime.sh
          sh scripts/fetch-sparkle.sh

      - name: Command-line tests and privacy scan
        run: sh scripts/run-tests.sh

      - name: Settings UI regression
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          for language in zh-Hans zh-Hant en ja; do
            for theme in light dark; do
              node scripts/test-settings-ui.cjs --language "$language" --theme "$theme" --out "build/ui-regression/$language-$theme"
            done
          done

      - name: Upload UI failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-regression
          path: build/ui-regression
          retention-days: 7
